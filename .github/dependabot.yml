version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Maintain compat entries of Julia dependencies (replaces CompatHelper).
  # The `docs` project is part of the workspace defined in Project.toml and
  # is therefore resolved together with the package.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Group all Julia package updates into a single PR
      all-julia-packages:
        patterns:
          - "*"
